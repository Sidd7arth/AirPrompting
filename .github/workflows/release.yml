name: Release

# Tag a commit `v<version>` and this produces the release artifacts.
#
#   v0.2.0  → tests on all three platforms
#           → signed (when credentials exist) installers for macOS and Windows
#           → combined SHA256SUMS.txt
#           → a DRAFT GitHub release holding the artifacts
#
# The release is left as a draft on purpose: publishing to the world is a
# deliberate human action, not a side effect of tagging (spec §57).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml

  package:
    name: Package
    needs: tests
    uses: ./.github/workflows/build.yml

  verify:
    name: Verify artifacts and assemble the release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version consistency (tag must match the manifests)
        run: |
          set -euo pipefail
          node scripts/check-versions.mjs
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error title=Version mismatch::Tag $TAG does not match the manifest version $VERSION."
            exit 1
          fi
          echo "tag $TAG matches the manifests"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble checksums
        run: |
          set -euo pipefail
          find artifacts -type f ! -name 'SHA256SUMS.txt' -exec cp {} . \;
          sha256sum airprompt* > SHA256SUMS.txt || true
          ls -l
          cat SHA256SUMS.txt

      - name: Report signing status
        run: |
          echo "::notice title=Signing::Artifacts are signed only if the repository has APPLE_* and WINDOWS_CERTIFICATE secrets. Absent credentials produce unsigned artifacts, named and reported as such by build.yml."

      - name: Create draft release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AirPrompt ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            SHA256SUMS.txt
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
