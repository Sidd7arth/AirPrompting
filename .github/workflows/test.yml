name: Tests

# Reusable: called by ci.yml and release.yml so the same suite gates both a
# pull request and a tagged release.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend (typecheck, build, guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Branding guard
        run: node scripts/check-branding.mjs

      - name: Secret guard
        run: node scripts/check-secrets.mjs

      - name: Version consistency
        run: node scripts/check-versions.mjs

      # Frontend↔backend command-name contract (62 commands must match 1:1).
      - name: IPC contract
        run: node scripts/check-ipc-contract.mjs

      # No frontend test runner is configured in this repository. The build and
      # typecheck above are the frontend gate. Adding a runner (vitest) is a
      # tracked release task; until then this workflow does not pretend to run
      # frontend tests it does not have.
      - name: Frontend unit tests
        run: |
          if npm test --silent 2>/dev/null; then
            echo "frontend tests ran"
          else
            echo "::notice::no frontend test runner configured; skipped"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The core has no GUI, no Tauri and no OS dependency, so it is the one
      # crate that must pass on every runner.
      - name: Core tests (all platforms)
        working-directory: src-tauri
        run: cargo test -p airprompt-core --all-targets

      - name: Core type check (all targets)
        working-directory: src-tauri
        run: cargo check -p airprompt-core --all-targets

      # The adapters and the Tauri shell only build on the platforms they
      # support: the platform crate emits compile_error! elsewhere by design.
      - name: Workspace tests (macOS and Windows)
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo test --workspace --no-fail-fast

      - name: Workspace type check (macOS and Windows)
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo check --workspace --all-targets

      - name: Workspace clippy (macOS and Windows)
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy -p airprompt-core --all-targets -- -D warnings

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Committed-secret scan
        run: node scripts/check-secrets.mjs

      - uses: dtolnay/rust-toolchain@stable

      - name: RustSec advisory audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Production dependency audit (npm)
        run: npm audit --omit=dev --audit-level=high
