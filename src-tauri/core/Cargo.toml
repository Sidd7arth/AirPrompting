[package]
name = "airprompt-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Platform-independent core for AirPrompt: settings, storage, speech, commands, formatting, security."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
